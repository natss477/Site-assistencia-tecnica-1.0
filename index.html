<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TI Estoque</title>

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>MONTEKALI | TI</h1>
        </header>

        <div class="container">

        <nav>
            <button id="btnEstoque">Estoque</button>
            <button id="btnRetirar">Retirar</button>
            <button id="btnDevolver">Devolver</button>
            <button id="btnStatusCompra">Status de Compra</button>
            <button id="btnLogout">Sair</button>
        </nav>

        <img src="logo-monte-serrat.png" class="logo-fundo">

        <main id="conteudo">


            <div class="page-header">
                <div>
                    <h2 id="tituloPagina">Equipamentos</h2>
                    <p>Controle de equipamentos do TI</p>
                </div>
            </div>

            <section class="estoque">

                <div class="card">
                    <h3>Monitores</h3>
                    <strong id="qtdMonitores">10</strong>
                    <span>disponiveis</span>
                </div>

                <div class="card">
                    <h3>Notebooks</h3>
                    <strong id="qtdNotebooks">5</strong>
                    <span>disponiveis</span>
                </div>

                <div class="card">
                    <h3>Teclados</h3>
                    <strong id="qtdTeclados">15</strong>
                    <span>disponiveis</span>
                </div>

            </section>

            
        </main>

        </div>

        <script src="script.js"></script>
    </body>
</html>
