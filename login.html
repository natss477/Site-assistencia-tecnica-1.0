<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MONTEKALI TI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

        <div class="login-container">

            <div class="login-box">

                <h1>MONTEKALI | TI</h1>

                <P>Acesso ao sistema</P>

                <div class="campo">
                    <label>Usuario</label>
                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite seu usuario"
                        >
                </div>

                <div class="campo">
                    <label>Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"

                        >
                </div>
                
                <div id="mensagemLogin"></div>

                    <button id="btnLogin">
                        Entrar
                    </button>
                    

            </div>

        </div>

        <script src="login.js"></script>

</body>

</html>
